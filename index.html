<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MelonClient Launcher</title>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #72db51; /* Matching melon green */
            font-family: sans-serif; display: flex;
            justify-content: center; align-items: center;
        }
        #melon-splash img {
            max-width: 80%; max-height: 80%; object-fit: contain;
            animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div id="melon-splash">
        <!-- Pulls the image directly from your repository's raw web link -->
        <img src="https://githubusercontent.com" alt="MelonClient Logo">
    </div>

    <script>
        // Holds the image for 3 seconds, then loads the game
        window.addEventListener('load', function() {
            setTimeout(function() {
                window.location.href = "game.html";
            }, 3000);
        });
    </script>
</body>

</html>
