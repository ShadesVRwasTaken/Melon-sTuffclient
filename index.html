<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MelonOS Dashboard</title>
    <style>
        /* Global OS Framework Theme Settings */
        :root {
            --bg-color: #162a18;
            --panel-bg: #122414;
            --accent-color: #72db51;
            --accent-hover: #a2e88d;
            --text-color: #ffffff;
            --border-color: #2d5431;
        }
        .light-theme {
            --bg-color: #d1f5c9;
            --panel-bg: #ffffff;
            --accent-color: #2d5431;
            --accent-hover: #162a18;
            --text-color: #122414;
            --border-color: #a2e88d;
        }
        body {
            margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            overflow: hidden; width: 100vw; height: 100vh; position: relative; user-select: none;
            transition: background 0.3s ease;
        }

        /* ABSOLUTE PLACEMENT DRAG DESKTOP WORKSPACE */
        .desktop-area {
            position: absolute; top: 0; left: 0; width: 100vw; height: calc(100vh - 45px); z-index: 1;
        }
        .desktop-shortcut {
            position: absolute; width: 90px; height: 95px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 8px; cursor: pointer;
            padding: 5px; border-radius: 8px; transition: background 0.1s ease; box-sizing: border-box;
        }
        .desktop-shortcut:hover { background-color: rgba(114, 219, 81, 0.15); }
        .shortcut-icon { font-size: 2.2rem; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); pointer-events: none; }
        .shortcut-label { font-size: 0.8rem; text-align: center; font-weight: 500; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); color: var(--text-color); pointer-events: none; word-break: break-all; }

        /* CHROME STYLE CONTEXT MENU */
        .context-menu {
            position: absolute; background-color: var(--panel-bg); border: 1px solid var(--border-color);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); border-radius: 6px; padding: 5px 0; z-index: 20000000;
            display: none; min-width: 140px;
        }
        .context-item {
            padding: 8px 15px; font-size: 0.85rem; color: var(--text-color); cursor: pointer; display: flex; align-items: center; gap: 8px;
        }
        .context-item:hover { background-color: var(--accent-color); color: #122414; font-weight: bold; }
        .context-item.disabled { color: #555 !important; cursor: not-allowed; background: transparent !important; }

        /* WINDOW LAYER SYSTEM DEFINITIONS */
        .window {
            position: absolute; background-color: var(--panel-bg);
            border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid var(--border-color); overflow: hidden;
            display: flex; flex-direction: column; min-width: 320px; min-height: 200px; z-index: 5;
        }
        .window-header {
            background-color: rgba(0,0,0,0.15); padding: 10px 15px; border-bottom: 2px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center; cursor: move;
        }
        .window-title { font-size: 0.9rem; font-weight: bold; color: var(--accent-color); display: flex; align-items: center; gap: 6px; }
        .window-controls { display: flex; gap: 8px; align-items: center; }
        .win-btn { width: 14px; height: 14px; border-radius: 50%; border: none; cursor: pointer; display: inline-block; }
        .win-close { background-color: #ff5f56; }
        .win-min { background-color: #ffbd2e; }
        .win-max { background-color: #27c93f; }
        .window-content { flex: 1; position: relative; width: 100%; height: 100%; background: #000; overflow: auto; }
        .window-content iframe { width: 100%; height: 100%; border: none; display: block; }

        /* FULLSCREEN SYSTEM OVERRIDES FOR THE GAME WINDOW */
        #game-window:fullscreen { width: 100vw !important; height: 100vh !important; border: none !important; border-radius: 0 !important; z-index: 2147483647 !important; }
        #game-window:fullscreen .window-header { display: none !important; }
        #game-window:fullscreen .window-content { height: 100vh !important; }
        #game-window:-webkit-full-screen { width: 100vw !important; height: 100vh !important; border: none !important; border-radius: 0 !important; z-index: 2147483647 !important; }
        #game-window:-webkit-full-screen .window-header { display: none !important; }
        #game-window:-webkit-full-screen .window-content { height: 100vh !important; }

        /* GLOBAL SYSTEM TASKBAR STYLING */
        .taskbar {
            position: absolute; bottom: 0; left: 0; width: 100vw; height: 45px;
            background-color: var(--panel-bg); border-top: 2px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center; padding: 0 15px;
            box-sizing: border-box; z-index: 1000000;
        }
        .taskbar-left, .taskbar-center, .taskbar-right { display: flex; align-items: center; gap: 15px; }
        .task-app-btn {
            background-color: rgba(114, 219, 81, 0.1); border: 1px solid var(--border-color);
            color: var(--text-color); padding: 5px 12px; border-radius: 5px; cursor: pointer; font-size: 0.8rem;
        }
        .task-app-btn.active-tab { border-color: var(--accent-color); background-color: rgba(114, 219, 81, 0.25); }
        .system-metric { font-size: 0.8rem; color: var(--accent-color); font-weight: 500; }
        
        /* WEB ENGINE ENVIRONMENT INTERFACE */
        .browser-bar { background-color: rgba(0,0,0,0.1); padding: 8px 12px; display: flex; gap: 10px; border-bottom: 2px solid var(--border-color); }
        .browser-input { flex: 1; padding: 6px 12px; border-radius: 5px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); font-size: 0.9rem; }
        .resize-handle { position: absolute; width: 14px; height: 14px; right: 0; bottom: 0; cursor: se-resize; z-index: 1000; }

        #iframe-splash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #72db51; display: flex; justify-content: center; align-items: center; z-index: 10; opacity: 1; transition: opacity 1.0s ease-in-out; pointer-events: all;
        }
        #iframe-splash img { max-width: 65%; max-height: 65%; object-fit: contain; }
        .splash-hidden { opacity: 0 !important; pointer-events: none !important; }
    </style>
</head>
<body>

    <!-- Context Options Dropdown Menu Element Template -->
    <div id="desktop-context-menu" class="context-menu">
        <div class="context-item" id="menu-open-action">🟢 Open App</div>
        <div class="context-item" id="menu-delete-action" style="color:#ff5f56;">🗑 Delete App</div>
    </div>

    <!-- Active Apps Desktop Desktop Shortcut Grid Area Container -->
    <div class="desktop-area" id="desktop-space">
        <div class="desktop-shortcut" id="shortcut-game-window" data-window="game-window" style="top: 20px; left: 20px;">
            <span class="shortcut-icon">🎮</span>
            <span class="shortcut-label">MelonClient</span>
        </div>
        <div class="desktop-shortcut" id="shortcut-google-window" data-window="google-window" style="top: 130px; left: 20px;">
            <span class="shortcut-icon">🌐</span>
            <span class="shortcut-label">Google</span>
        </div>
    </div>

    <!-- WINDOW 1: Core Eaglercraft Minecraft Environment Container -->
    <div class="window" id="game-window" style="top: 50px; left: 150px; width: 720px; height: 460px;">
        <div class="window-header">
            <span class="window-title">🎮 MelonClient Workspace <span id="load-status" style="color:var(--accent-hover); font-size:0.75rem; margin-left:10px;">Connecting...</span></span>
            <div class="window-controls">
                <button class="win-btn win-min" onclick="minimizeWindow('game-window')"></button>
                <button class="win-btn win-max" onclick="maximizeWindow('game-window')"></button>
                <button class="win-btn win-close" onclick="closeWindow('game-window')"></button>
            </div>
        </div>
        <div class="window-content" style="background:#000;">
            <div id="iframe-splash">
                <img src="MelonClient.png" alt="MelonClient Logo">
            </div>
            <iframe id="game-frame" src="game.html" title="MelonClient Sandbox"></iframe>
        </div>
        <div class="resize-handle"></div>
    </div>
    <!-- WINDOW 2: Google Browser App Shell Frame Container -->
    <div class="window" id="google-window" style="top: 80px; left: 240px; width: 740px; height: 480px; display: none;">
        <div class="window-header">
            <span class="window-title">🌐 Google Browser Engine (Masked Proxy Node)</span>
            <div class="window-controls">
                <button class="win-btn win-min" onclick="minimizeWindow('google-window')"></button>
                <button class="win-btn win-max" onclick="maximizeWindow('google-window')"></button>
                <button class="win-btn win-close" onclick="closeWindow('google-window')"></button>
            </div>
        </div>
        <div class="browser-bar">
            <input type="text" id="browser-url-bar" class="browser-input" placeholder="Type link or search (e.g., youtube.com)..." value="youtube.com">
            <button class="task-app-btn" onclick="navigateBrowser()">Go</button>
            <button class="task-app-btn" style="background:var(--accent-color); color:black; font-weight:bold;" onclick="installCurrentWebpage()">Install App</button>
        </div>
        <!-- Injects the unblocked engine backend dynamically into your aligned window container -->
        <div class="window-content" id="browser-target-root" style="background:#ffffff; margin:0; padding:0; height:calc(100% - 39px); width:100%; overflow:hidden;">
            <iframe id="custom-browser-iframe" src="https://vercel.app" style="width:100%; height:100%; border:none; margin:0; padding:0;" allow="autoplay; fullscreen; encrypted-media;"></iframe>
        </div>
        <div class="resize-handle"></div>
    </div>

    <!-- MASTER HARDWARE OPERATIONAL TASKBAR SYSTEM -->
    <div class="taskbar">
        <div class="taskbar-left" id="active-tabs-tray">
            <span class="system-metric" style="font-weight:bold; letter-spacing:1px; cursor:pointer;" onclick="toggleSystemSettings()">🍉 MelonOS</span>
        </div>
        <div class="taskbar-right">
            <div class="system-metric" id="sys-battery">🔋 Batt: 100%</div>
            <div class="system-metric" id="sys-clock">00:00:00 PM</div>
        </div>
    </div>
    <script type="text/javascript">
        const gameFrame = document.getElementById('game-frame');
        const splashOverlay = document.getElementById('iframe-splash');
        const loadStatus = document.getElementById('load-status');
        const ctxMenu = document.getElementById('desktop-context-menu');
        
        let windowZIndex = 10;
        let selectedShortcutId = null;
        const initialPositions = {};

        const GRID_X = 95;
        const GRID_Y = 105;

        gameFrame.addEventListener('load', function() {
            loadStatus.innerText = "Syncing Options (5s)...";
            setTimeout(function() {
                if (splashOverlay) {
                    loadStatus.innerText = "Running";
                    splashOverlay.classList.add('splash-hidden');
                    setTimeout(() => splashOverlay.remove(), 1000);
                }
            }, 5000); 
        });

        function updateClock() {
            const now = new Date();
            document.getElementById('sys-clock').innerText = now.toLocaleTimeString() + " | " + now.toLocaleDateString();
        }
        setInterval(updateClock, 1000);
        updateClock();

        if(navigator.getBattery) {
            navigator.getBattery().then(bat => {
                const updateBatt = () => document.getElementById('sys-battery').innerText = `🔋 Batt: ${Math.round(bat.level * 100)}%`;
                updateBatt();
                bat.addEventListener('levelchange', updateBatt);
            });
        }

        function toggleSystemSettings() { document.body.classList.toggle('light-theme'); }

        // Secure unblocked proxy request mapping loops
        function navigateBrowser() {
            let inputVal = document.getElementById('browser-url-bar').value.trim();
            const browserFrame = document.getElementById('custom-browser-iframe');
            if(inputVal === "") return;

            // Proxies requests through the optimized backend architecture
            let finalProxyPath = "https://vercel.app";
            if(browserFrame) browserFrame.src = finalProxyPath;
        }

        function installCurrentWebpage() {
            const currentUrl = document.getElementById('browser-url-bar').value.trim();
            const space = document.getElementById('desktop-space');
            if(currentUrl === "") return;

            let finalProxyPath = "https://vercel.app";
            let cleanLabel = currentUrl.replace(/^(https?:\/\/)?(www\.)?/, '').split('/');
            let safeId = "app-" + Math.floor(Math.random() * 100000);

            const shortcut = document.createElement('div');
            shortcut.className = 'desktop-shortcut';
            shortcut.id = "shortcut-" + safeId;
            shortcut.setAttribute('data-window', safeId);
            shortcut.style.top = "20px";
            shortcut.style.left = "130px";
            shortcut.innerHTML = `<span class="shortcut-icon">🚀</span><span class="shortcut-label">${cleanLabel}</span>`;
            
            const newWin = document.createElement('div');
            newWin.className = 'window';
            newWin.id = safeId;
            newWin.style = "top:110px; left:220px; width:600px; height:400px; display:none;";
            newWin.innerHTML = `
                <div class="window-header">
                    <span class="window-title">🚀 ${cleanLabel}</span>
                    <div class="window-controls">
                        <button class="win-btn win-min" onclick="minimizeWindow('${safeId}')"></button>
                        <button class="win-btn win-max" onclick="maximizeWindow('${safeId}')"></button>
                        <button class="win-btn win-close" onclick="closeWindow('${safeId}')"></button>
                    </div>
                </div>
                <div class="window-content" style="background:#fff; margin:0; padding:0;"><iframe src="${finalProxyPath}" style="width:100%; height:100%; border:none; margin:0; padding:0;" allow="autoplay; fullscreen; encrypted-media;"></iframe></div>
                <div class="resize-handle"></div>
            `;

            document.body.appendChild(newWin);
            space.appendChild(shortcut);
            setupWindowManagerEvents(newWin);
            setupShortcutEvents(shortcut);
        }
        function setupShortcutEvents(sc) {
            sc.addEventListener('dblclick', () => openWindow(sc.getAttribute('data-window')));

            sc.addEventListener('contextmenu', (e) => {
                e.preventDefault(); e.stopPropagation();
                selectedShortcutId = sc.id;
                ctxMenu.style.top = e.clientY + 'px'; ctxMenu.style.left = e.clientX + 'px'; ctxMenu.style.display = 'block';

                const targetWin = sc.getAttribute('data-window');
                const delBtn = document.getElementById('menu-delete-action');
                if(targetWin === 'game-window' || targetWin === 'google-window') {
                    delBtn.classList.add('disabled'); delBtn.style.opacity = "0.4";
                } else {
                    delBtn.classList.remove('disabled'); delBtn.style.opacity = "1";
                }
            });

            sc.addEventListener('mousedown', (e) => {
                if(e.button !== 0) return;
                let startX = e.clientX, startY = e.clientY;
                let origLeft = sc.offsetLeft, origTop = sc.offsetTop;

                function dragIcon(ev) {
                    sc.style.left = (origLeft + ev.clientX - startX) + 'px';
                    sc.style.top = (origTop + ev.clientY - startY) + 'px';
                }
                function dropIcon() {
                    document.removeEventListener('mousemove', dragIcon);
                    document.removeEventListener('mouseup', dropIcon);

                    let currentLeft = sc.offsetLeft;
                    let currentTop = sc.offsetTop;

                    let snappedLeft = Math.round(currentLeft / GRID_X) * GRID_X;
                    let snappedTop = Math.round(currentTop / GRID_Y) * GRID_Y;

                    if(snappedLeft < 10) snappedLeft = 20;
                    if(snappedTop < 10) snappedTop = 20;

                    sc.style.left = snappedLeft + "px";
                    sc.style.top = snappedTop + "px";
                }
                document.addEventListener('mousemove', dragIcon);
                document.addEventListener('mouseup', dropIcon);
            });
        }

        document.getElementById('menu-open-action').onclick = () => {
            if(selectedShortcutId) openWindow(document.getElementById(selectedShortcutId).getAttribute('data-window'));
        };

        document.getElementById('menu-delete-action').onclick = () => {
            if(selectedShortcutId) {
                const sc = document.getElementById(selectedShortcutId);
                const targetWin = sc.getAttribute('data-window');
                if(targetWin === 'game-window' || targetWin === 'google-window') return;
                document.getElementById(targetWin).remove(); sc.remove();
                ctxMenu.style.display = 'none'; updateTaskbarTray();
            }
        };

        document.addEventListener('click', () => ctxMenu.style.display = 'none');

        function openWindow(id) { const win = document.getElementById(id); win.style.display = 'flex'; windowZIndex++; win.style.zIndex = windowZIndex; updateTaskbarTray(); }
        function closeWindow(id) { document.getElementById(id).style.display = 'none'; updateTaskbarTray(); }
        function minimizeWindow(id) { const win = document.getElementById(id); win.style.display = win.style.display === 'none' ? 'flex' : 'none'; }
        function maximizeWindow(id) {
            const win = document.getElementById(id);
            if(id === 'game-window') {
                if(win.requestFullscreen) { win.requestFullscreen(); }
                else if(win.webkitRequestFullscreen) { win.webkitRequestFullscreen(); }
                return;
            }
            if (win.style.width === '100vw') {
                win.style.top = initialPositions[id].top; win.style.left = initialPositions[id].left;
                win.style.width = initialPositions[id].width; win.style.height = initialPositions[id].height;
            } else {
                initialPositions[id] = { top: win.style.top, left: win.style.left, width: win.style.width, height: win.style.height };
                win.style.top = '0px'; win.style.left = '0px'; win.style.width = '100vw'; win.style.height = 'calc(100vh - 45px)';
            }
        }

        function updateTaskbarTray() {
            const tray = document.getElementById('active-tabs-tray');
            tray.innerHTML = '<span class="system-metric" style="font-weight:bold; letter-spacing:1px; cursor:pointer;" onclick="toggleSystemSettings()">🍉 MelonOS</span>';
            document.querySelectorAll('.window').forEach(win => {
                if(win.style.display !== 'none') {
                    const label = win.querySelector('.window-title').innerText.split('\n');
                    const tab = document.createElement('button');
                    tab.className = 'task-app-btn active-tab'; tab.innerText = label;
                    tab.onclick = () => minimizeWindow(win.id); tray.appendChild(tab);
                }
            });
        }

        function setupWindowManagerEvents(win) {
            const header = win.querySelector('.window-header');
            const handle = win.querySelector('.resize-handle');
            
            win.addEventListener('mousedown', () => { windowZIndex++; win.style.zIndex = windowZIndex; });
            header.addEventListener('mousedown', (e) => {
                if(e.target.classList.contains('win-btn') || e.target.classList.contains('browser-input')) return;
                let startX = e.clientX, startY = e.clientY, origLeft = win.offsetLeft, origTop = win.offsetTop;
                function drag(ev) { win.style.left = (origLeft + ev.clientX - startX) + 'px'; win.style.top = (origTop + ev.clientY - startY) + 'px'; }
                function drop() { document.removeEventListener('mousemove', drag); document.removeEventListener('mouseup', drop); }
                document.addEventListener('mousemove', drag); document.addEventListener('mouseup', drop);
            });
            handle.addEventListener('mousedown', (e) => {
                e.preventDefault();
                let startW = win.offsetWidth, startH = win.offsetHeight, startX = e.clientX, startY = e.clientY;
                function resize(ev) { win.style.width = (startW + ev.clientX - startX) + 'px'; win.style.height = (startH + ev.clientY - startY) + 'px'; }
                function unbind() { document.removeEventListener('mousemove', resize); document.removeEventListener('mouseup', unbind); }
                document.addEventListener('mousemove', resize); document.addEventListener('mouseup', unbind);
            });
        }

        document.querySelectorAll('.window').forEach(setupWindowManagerEvents);
        document.querySelectorAll('.desktop-shortcut').forEach(setupShortcutEvents);
        updateTaskbarTray();
    </script>
</body>
</html>
