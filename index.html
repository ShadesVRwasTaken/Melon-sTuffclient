<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MelonClient Hub</title>
    <style>
        /* Global Reset & Dark Theme */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a331c; /* Deep dark melon green */
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Top Header Configuration */
        header {
            background-color: #122414;
            padding: 20px;
            text-align: center;
            border-bottom: 4px solid #72db51;
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
            color: #72db51; /* Lime green brand accent */
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        header p {
            margin: 5px 0 0 0;
            color: #a2e88d;
            font-size: 1rem;
        }

        /* Dashboard Container */
        .content-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            padding: 30px 10px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Container Panels */
        .frame-card {
            width: 100%;
            max-width: 1024px;
            background-color: #122414;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            border: 2px solid #2d5431;
            overflow: hidden;
        }

        .frame-header {
            background-color: #1a331c;
            padding: 15px 20px;
            border-bottom: 2px solid #2d5431;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .frame-header h2 {
            margin: 0;
            font-size: 1.3rem;
            color: #72db51;
        }

        /* 16:9 Widescreen Iframe Scaler */
        .game-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; 
        }

        .game-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Custom MelonClient Splash Overlay */
        #iframe-splash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #72db51; /* Exact matching brand lime green */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10; /* Keeps it directly over the iframe canvas */
            opacity: 1;
            transition: opacity 1.0s ease-in-out; /* Smooth 1 second transition fade out */
            pointer-events: all; /* Disables clicking the interface elements underneath */
        }

        #iframe-splash img {
            max-width: 75%;
            max-height: 75%;
            object-fit: contain;
        }

        /* Fade-out tracking class used by the script timer */
        .splash-hidden {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* Skindex Panel Setup */
        .skin-wrapper {
            width: 100%;
            height: 650px;
        }

        .skin-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #ffffff;
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: #122414;
            color: #639c67;
            font-size: 0.9rem;
            margin-top: 40px;
            border-top: 2px solid #2d5431;
        }
    </style>
</head>
<body>

    <header>
        <h1>MELONCLIENT</h1>
        <p>The Ultimate 1.12 Minecraft Web Hub</p>
    </header>

    <div class="content-container">

        <!-- SECTION 1: Game Viewport Frame Container -->
        <div class="frame-card">
            <div class="frame-header">
                <h2>🎮 Game Client Instance</h2>
                <span id="load-status" style="color:#a2e88d; font-size:0.85rem;">Connecting...</span>
            </div>
            <div class="game-wrapper">
                <!-- Splash overlay locks here, safely covering the Eaglercraft file initialization screen -->
                <div id="iframe-splash">
                    <img src="MelonClient.png" alt="MelonClient Logo">
                </div>
                <iframe id="game-frame" src="game.html" title="MelonClient Game View"></iframe>
            </div>
        </div>

        <!-- SECTION 2: Skin Finder Iframe Section -->
        <div class="frame-card">
            <div class="frame-header">
                <h2>👕 Skin Browser</h2>
                <span style="color: #a2e88d; font-size: 0.85rem;">Find a skin, download it, and upload in-game!</span>
            </div>
            <div class="skin-wrapper">
                <iframe src="https://minecraftskins.com" title="Skindex Skin Browser"></iframe>
            </div>
        </div>

    </div>

    <footer>
        <p>&copy; 2026 MelonClient | Powered by GitHub Pages</p>
    </footer>

    <script type="text/javascript">
        const gameFrame = document.getElementById('game-frame');
        const splashOverlay = document.getElementById('iframe-splash');
        const loadStatus = document.getElementById('load-status');

        // Activates runtime checks right when the iframe asset components complete loading
        gameFrame.addEventListener('load', function() {
            loadStatus.innerText = "Initializing System Options...";
            
            // Fires an exact 5-second hold loop to cover the client warning layout
            setTimeout(function() {
                if (splashOverlay) {
                    loadStatus.innerText = "Running";
                    loadStatus.style.color = "#72db51";
                    
                    // Triggers the 1-second animation fade out
                    splashOverlay.classList.add('splash-hidden');
                    
                    // Safely cleans up the overlay from active DOM tree layout after opacity hits 0
                    setTimeout(() => splashOverlay.remove(), 1000);
                }
            }, 5000); /* 5000 milliseconds = Exactly 5 seconds */
        });
    </script>

</body>
</html>
