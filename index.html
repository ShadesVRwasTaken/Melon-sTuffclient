<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MelonClient Launcher</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #72db51; /* Custom lime green background */
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #melon-splash {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        #melon-splash img {
            max-width: 75%;
            max-height: 75%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div id="melon-splash">
        <!-- Loads the PNG directly. Capital letters must match your repo file exactly! -->
        <img src="MelonClient.png" alt="MelonClient Logo">
    </div>

    <script>
        // Wait 3 seconds, then automatically redirect to your game client
        window.addEventListener('load', function() {
            setTimeout(function() {
                window.location.href = "game.html";
            }, 3000);
        });
    </script>
</body>
</html>
