<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MelonClient Hub</title>
    <style>
        /* Global Reset & Dark Theme */
        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a331c; color: #ffffff; overflow-x: hidden;
        }
        header {
            background-color: #122414; padding: 20px;
            text-align: center; border-bottom: 4px solid #72db51;
        }
        header h1 { margin: 0; font-size: 2.5rem; color: #72db51; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        header p { margin: 5px 0 0 0; color: #a2e88d; font-size: 1rem; }
        .content-container {
            display: flex; flex-direction: column; align-items: center;
            gap: 40px; padding: 30px 10px; max-width: 1200px; margin: 0 auto;
        }
        .frame-card {
            width: 100%; max-width: 1024px; background-color: #122414;
            border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            border: 2px solid #2d5431; overflow: hidden; position: relative;
        }
        
        /* HOVER BAR HIDE / SHOW STYLING RULES */
        .frame-header {
            background-color: #1a331c; padding: 15px 20px; border-bottom: 2px solid #2d5431;
            display: flex; justify-content: space-between; align-items: center;
            position: relative; top: 0; left: 0; width: 100%; box-sizing: border-box;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease;
            z-index: 999999;
        }
        .frame-header h2 { margin: 0; font-size: 1.3rem; color: #72db51; }
        .header-controls { display: flex; align-items: center; gap: 15px; }

        /* Fullscreen operational bindings */
        .frame-card:fullscreen {
            width: 100vw !important; height: 100vh !important;
            max-width: 100vw !important; border: none !important; border-radius: 0px !important;
        }
        .frame-card:-webkit-full-screen {
            width: 100vw !important; height: 100vh !important;
            max-width: 100vw !important; border: none !important; border-radius: 0px !important;
        }

        .frame-card:fullscreen .frame-header { position: absolute; transform: translateY(-100%); opacity: 0; }
        .frame-card:-webkit-full-screen .frame-header { position: absolute; transform: translateY(-100%); opacity: 0; }

        .frame-card:fullscreen .frame-header:hover,
        .frame-card:fullscreen .frame-header-hotzone:hover + .frame-header {
            transform: translateY(0); opacity: 1;
        }
        .frame-card:-webkit-full-screen .frame-header:hover,
        .frame-card:-webkit-full-screen .frame-header-hotzone:hover + .frame-header {
            transform: translateY(0); opacity: 1;
        }

        .frame-header-hotzone {
            display: none; position: absolute; top: 0; left: 0;
            width: 100%; height: 25px; z-index: 999998;
        }
        .frame-card:fullscreen .frame-header-hotzone { display: block; }
        .frame-card:-webkit-full-screen .frame-header-hotzone { display: block; }

        .action-btn {
            background-color: #72db51; color: #122414; border: none; padding: 8px 16px;
            font-weight: bold; font-size: 0.85rem; border-radius: 6px; cursor: pointer;
            text-decoration: none; display: inline-flex; align-items: center;
            transition: all 0.2s ease-in-out; box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        .action-btn:hover { background-color: #a2e88d; transform: translateY(-1px); }
        
        .game-wrapper { position: relative; width: 100%; padding-top: 56.25%; background-color: #000000; }
        .game-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        .frame-card:fullscreen .game-wrapper { padding-top: 0; height: 100vh; width: 100vw; }
        .frame-card:-webkit-full-screen .game-wrapper { padding-top: 0; height: 100vh; width: 100vw; }

        #iframe-splash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #72db51; display: flex; justify-content: center;
            align-items: center; z-index: 10; opacity: 1; transition: opacity 1.0s ease-in-out; pointer-events: all;
        }
        #iframe-splash img { max-width: 75%; max-height: 75%; object-fit: contain; }
        .splash-hidden { opacity: 0 !important; pointer-events: none !important; }
        
        /* UNBLOCKED SKIN LIBRARY INTERFACE STYLES */
        .skin-library-wrapper {
            width: 100%; height: 600px; background-color: #0c180d;
        }
        .skin-library-wrapper iframe {
            width: 100%; height: 100%; border: none;
        }
        footer { text-align: center; padding: 20px; background-color: #122414; color: #639c67; font-size: 0.9rem; margin-top: 40px; border-top: 2px solid #2d5431; }
    </style>
</head>
<body>
    <header>
        <h1>MELONCLIENT</h1>
        <p>The Ultimate 1.12 Minecraft Web Hub</p>
    </header>
    <div class="content-container">
        <!-- SECTION 1: Game Client Viewer Container -->
        <div class="frame-card" id="game-card">
            <div class="frame-header-hotzone"></div>
            <div class="frame-header">
                <h2>🎮 Game Client Instance</h2>
                <div class="header-controls">
                    <span id="load-status" style="color:#a2e88d; font-size:0.85rem;">Connecting...</span>
                    <button class="action-btn" onclick="toggleFullscreen()">🖵 Fullscreen</button>
                </div>
            </div>
            <div class="game-wrapper">
                <div id="iframe-splash">
                    <img src="MelonClient.png" alt="MelonClient Logo">
                </div>
                <iframe id="game-frame" src="game.html" title="MelonClient Game View" allow="fullscreen"></iframe>
            </div>
        </div>
        <!-- SECTION 2: Fully Embedded, Unblocked Skin Finder Library -->
        <div class="frame-card">
            <div class="frame-header">
                <h2>👕 Skin Finder & Downloader Library</h2>
                <span style="color: #a2e88d; font-size: 0.85rem;">Search, select a skin, and download the file!</span>
            </div>
            <div class="skin-library-wrapper">
                <!-- Connects straight to an open, embed-ready Minecraft Skin Database catalog -->
                <iframe src="https://minecraftskinstealer.com" title="Skin Finder Engine" allow="download-without-user-activation"></iframe>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 MelonClient | Powered by GitHub Pages</p>
    </footer>

    <script type="text/javascript">
        const gameFrame = document.getElementById('game-frame');
        const splashOverlay = document.getElementById('iframe-splash');
        const loadStatus = document.getElementById('load-status');
        const gameCard = document.getElementById('game-card');

        // Handles the custom 5 second holding mask illusion
        gameFrame.addEventListener('load', function() {
            loadStatus.innerText = "Initializing System Options...";
            setTimeout(function() {
                if (splashOverlay) {
                    loadStatus.innerText = "Running";
                    loadStatus.style.color = "#72db51";
                    splashOverlay.classList.add('splash-hidden');
                    setTimeout(() => splashOverlay.remove(), 1000);
                }
            }, 5000); 
        });

        // Advanced multi-browser engine compatibility layout for clean fullscreen switching
        function toggleFullscreen() {
            if (!document.fullscreenElement && !document.mozFullScreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {  
                if (gameCard.requestFullscreen) { gameCard.requestFullscreen(); }
                else if (gameCard.msRequestFullscreen) { gameCard.msRequestFullscreen(); }
                else if (gameCard.mozRequestFullScreen) { gameCard.mozRequestFullScreen(); }
                else if (gameCard.webkitRequestFullscreen) { gameCard.webkitRequestFullscreen(Element.ALLOW_KEYBOARD_INPUT); }
            } else {
                if (document.exitFullscreen) { document.exitFullscreen(); }
                else if (document.msExitFullscreen) { document.msExitFullscreen(); }
                else if (document.mozCancelFullScreen) { document.mozCancelFullScreen(); }
                else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); }
            }
        }
    </script>
</body>
</html>
