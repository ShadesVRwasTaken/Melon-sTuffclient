<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MelonClient Hub</title>
    <!-- Official YouTube Player API Endpoint Script Hook -->
    <script src="https://youtube.com"></script>
    <style>
        /* Global Reset & Virtual Desktop Theme */
        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #162a18; 
            background-image: radial-gradient(#203d23 1px, transparent 0);
            background-size: 24px 24px;
            color: #ffffff; overflow: hidden; width: 100vw; height: 100vh;
            position: relative; user-select: none;
        }
        header {
            background-color: #122414; padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 3px solid #72db51; z-index: 10000; position: relative;
        }
        header h1 { margin: 0; font-size: 1.6rem; color: #72db51; letter-spacing: 1px; }
        
        /* WINDOW MANAGER STYLES AND LAYOUT OVERRIDES */
        .window {
            position: absolute; background-color: #122414;
            border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid #2d5431; overflow: hidden;
            display: flex; flex-direction: column; min-width: 280px; min-height: 160px;
        }
        .window-header {
            background-color: #1a331c; padding: 10px 15px; border-bottom: 2px solid #2d5431;
            display: flex; justify-content: space-between; align-items: center; cursor: move;
        }
        .window-title { margin: 0; font-size: 0.95rem; font-weight: bold; color: #72db51; }
        .window-content { flex: 1; position: relative; width: 100%; height: 100%; background: #000; }
        .window-content iframe { width: 100%; height: 100%; border: none; display: block; }
        
        /* FULLSCREEN INTERACTIVE HOVER ACTIONS */
        #game-card .window-header {
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease;
        }
        #game-card:fullscreen .window-header { 
            position: absolute; top: 0; left: 0; width: 100%; z-index: 100; 
            transform: translateY(-100%); opacity: 0; 
        }
        #game-card:fullscreen:hover .window-header { transform: translateY(0); opacity: 1; }
        #game-card:fullscreen .game-wrapper { padding-top: 0; height: 100vh; width: 100vw; }
        #game-card:fullscreen .game-wrapper iframe { height: 100vh; width: 100vw; }

        #game-card:-webkit-full-screen .window-header { position: absolute; top: 0; left: 0; width: 100%; z-index: 100; transform: translateY(-100%); opacity: 0; }
        #game-card:-webkit-full-screen:hover .window-header { transform: translateY(0); opacity: 1; }
        #game-card:-webkit-full-screen .game-wrapper { padding-top: 0; height: 100vh; width: 100vw; }
        #game-card:-webkit-full-screen .game-wrapper iframe { height: 100vh; width: 100vw; }

        /* RESIZE TRACKER HANDLES */
        .resize-handle {
            position: absolute; width: 16px; height: 16px; background-color: transparent;
            right: 0; bottom: 0; cursor: se-resize; z-index: 1000;
        }
        .control-row { display: flex; align-items: center; gap: 12px; }
        .action-btn {
            background-color: #72db51; color: #122414; border: none; padding: 6px 12px;
            font-weight: bold; font-size: 0.8rem; border-radius: 5px; cursor: pointer;
            transition: background 0.2s;
        }
        .action-btn:hover { background-color: #a2e88d; }
        
        /* MIXER KNOB SLIDERS */
        .vol-mixer { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #a2e88d; }
        .vol-slider {
            -webkit-appearance: none; width: 80px; height: 6px; border-radius: 3px;
            background: #2d5431; outline: none; cursor: pointer;
        }
        .vol-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
            background: #72db51; cursor: pointer;
        }

        #game-wrapper-box { width: 100%; height: 100%; position: relative; }
        #game-wrapper-box iframe { width: 100%; height: 100%; border: none; }

        /* RUNTIME INTRO MASK */
        #iframe-splash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #72db51; display: flex; justify-content: center;
            align-items: center; z-index: 10; opacity: 1; transition: opacity 1.0s ease-in-out; pointer-events: all;
        }
        #iframe-splash img { max-width: 65%; max-height: 65%; object-fit: contain; }
        .splash-hidden { opacity: 0 !important; pointer-events: none !important; }
        
        /* BALANCED WINDOW PLACEMENTS FOR STANDARD RESPONSIVE VIEWS */
        #game-card { top: 75px; left: 20px; width: 680px; height: 440px; z-index: 10; }
        #spotify-card { top: 75px; right: 20px; width: 340px; height: 420px; z-index: 5; }
        #youtube-card { bottom: 20px; right: 20px; width: 440px; height: 290px; z-index: 5; }
    </style>
</head>
<body>
    <header>
        <h1>MELONCLIENT OS</h1>
        <div class="control-row">
            <div class="vol-mixer">
                <span>🔊 Game Vol:</span>
                <input type="range" id="game-volume-slider" class="vol-slider" min="0" max="100" value="100" oninput="adjustGameVolume(this.value)">
            </div>
            <button class="action-btn" onclick="toggleFullscreen()">🖵 Fullscreen Client</button>
        </div>
    </header>

    <!-- WINDOW WORKSPACE 1: Scalable Game Container Framework -->
    <div class="window" id="game-card">
        <div class="window-header">
            <span class="window-title">🎮 MelonClient Engine Canvas</span>
            <span id="load-status" style="color:#a2e88d; font-size:0.8rem;">Connecting...</span>
        </div>
        <div class="window-content" style="height: calc(100% - 39px); width:100%;">
            <div id="game-wrapper-box">
                <div id="iframe-splash">
                    <img src="MelonClient.png" alt="MelonClient Logo">
                </div>
                <iframe id="game-frame" src="game.html" title="MelonClient Frame View" allow="fullscreen"></iframe>
            </div>
        </div>
        <div class="resize-handle"></div>
    </div>
    <!-- WINDOW WORKSPACE 2: Secure Authenticated Spotify Widget Panel -->
    <div class="window" id="spotify-card">
        <div class="window-header">
            <span class="window-title">🎵 Spotify Mini-Player</span>
            <span style="color:#a2e88d; font-size: 0.75rem;">Online</span>
        </div>
        <div class="window-content" style="height: calc(100% - 39px);">
            <!-- Injected missing web permissions layout parameters to clear the empty file bug -->
            <iframe id="spotify-frame" src="https://spotify.com" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        </div>
        <div class="resize-handle"></div>
    </div>

    <!-- WINDOW WORKSPACE 3: Fixed Live API YouTube Engine Window -->
    <div class="window" id="youtube-card">
        <div class="window-header">
            <span class="window-title">📺 YouTube Miniplayer</span>
            <div class="vol-mixer">
                <span>Vol:</span>
                <input type="range" class="vol-slider" min="0" max="100" value="50" oninput="adjustYTVolume(this.value)">
            </div>
        </div>
        <div class="window-content" style="height: calc(100% - 39px);">
            <!-- Embedded placeholder targeted directly by the automated initialization script -->
            <div id="yt-player-placeholder" style="width:100%; height:100%;"></div>
        </div>
        <div class="resize-handle"></div>
    </div>

    <script type="text/javascript">
        const gameFrame = document.getElementById('game-frame');
        const splashOverlay = document.getElementById('iframe-splash');
        const loadStatus = document.getElementById('load-status');
        const gameCard = document.getElementById('game-card');
        let ytPlayer = null;

        // Triggers the active media proxy stream loader using an active 24/7 video track ID
        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('yt-player-placeholder', {
                width: '100%',
                height: '100%',
                videoId: 'jfKfPfyJRdk', // Verified, stable 24/7 Lofi Stream track ID asset
                playerVars: { 'controls': 1, 'enablejsapi': 1, 'autoplay': 1, 'mute': 0 },
                events: { 'onReady': (e) => e.target.setVolume(50) }
            });
        }

        // Monitors system asset delivery speeds to complete the loading window mask
        gameFrame.addEventListener('load', function() {
            loadStatus.innerText = "Initializing Options...";
            setTimeout(function() {
                if (splashOverlay) {
                    loadStatus.innerText = "Running";
                    loadStatus.style.color = "#72db51";
                    splashOverlay.classList.add('splash-hidden');
                    setTimeout(() => splashOverlay.remove(), 1000);
                }
            }, 5000); 
        });

        // DESKTOP INTERACTION SYSTEM CORE SCRIPT
        let highestZ = 10;
        document.querySelectorAll('.window').forEach(win => {
            const header = win.querySelector('.window-header');
            const handle = win.querySelector('.resize-handle');
            
            win.addEventListener('mousedown', () => { highestZ++; win.style.zIndex = highestZ; });

            // Universal Frame Dragging
            header.addEventListener('mousedown', (e) => {
                if(e.target.classList.contains('vol-slider')) return;
                highestZ++; win.style.zIndex = highestZ;
                let startX = e.clientX, startY = e.clientY, origLeft = win.offsetLeft, origTop = win.offsetTop;
                function doDrag(ev) {
                    win.style.left = (origLeft + ev.clientX - startX) + 'px';
                    win.style.top = (origTop + ev.clientY - startY) + 'px';
                }
                function stopDrag() { document.removeEventListener('mousemove', doDrag); document.removeEventListener('mouseup', stopDrag); }
                document.addEventListener('mousemove', doDrag); document.addEventListener('mouseup', stopDrag);
            });

            // Universal Frame Resizing + Canvas Dynamic Scaling Refresher Updates
            handle.addEventListener('mousedown', (e) => {
                e.preventDefault();
                let startW = win.offsetWidth, startH = win.offsetHeight, startX = e.clientX, startY = e.clientY;
                function doResize(ev) {
                    win.style.width = (startW + ev.clientX - startX) + 'px';
                    win.style.height = (startH + ev.clientY - startY) + 'px';
                    
                    // Forces the squished internal canvas rendering tree to clear out layout space recalculations
                    if(win.id === 'game-card' && gameFrame.contentWindow) {
                        gameFrame.style.width = "100%";
                        gameFrame.style.height = "100%";
                    }
                }
                function stopResize() { document.removeEventListener('mousemove', doResize); document.removeEventListener('mouseup', stopResize); }
                document.addEventListener('mousemove', doResize); document.addEventListener('mouseup', stopResize);
            });
        });

        // BALANCED GAIN ATTENUATOR NETWORKS
        function adjustGameVolume(val) {
            try {
                if (gameFrame.contentWindow) {
                    gameFrame.contentWindow.postMessage({ type: "EAGLER_VOLUME", value: val / 100 }, "*");
                }
            } catch(e) {}
        }

        function adjustYTVolume(val) {
            if (ytPlayer && typeof ytPlayer.setVolume === 'function') {
                ytPlayer.setVolume(parseInt(val));
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {  
                if (gameCard.requestFullscreen) { gameCard.requestFullscreen(); }
                else if (gameCard.webkitRequestFullscreen) { gameCard.webkitRequestFullscreen(); }
            } else {
                if (document.exitFullscreen) { document.exitFullscreen(); }
                else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); }
            }
        }
    </script>
</body>
</html>
